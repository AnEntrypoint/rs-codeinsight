name: Release

on:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: codeinsight-release
  cancel-in-progress: false

jobs:
  publish:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      wasm_artifact_name: rs_codeinsight.wasm
      published_asset_basename: codeinsight
      release_repo: AnEntrypoint/agentplug-codeinsight-bin
      release_title_prefix: agentplug-codeinsight
      pre_build_steps: |
        set -e
        WASI_VERSION=24
        curl -sL -o wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION}.0-x86_64-linux.tar.gz"
        mkdir -p $HOME/wasi-sdk
        tar -xzf wasi-sdk.tar.gz -C $HOME/wasi-sdk --strip-components=1
        echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> $GITHUB_ENV
        echo "CC_wasm32_wasip1=$HOME/wasi-sdk/bin/clang" >> $GITHUB_ENV
        echo "AR_wasm32_wasip1=$HOME/wasi-sdk/bin/llvm-ar" >> $GITHUB_ENV
        echo "CFLAGS_wasm32_wasip1=--sysroot=$HOME/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV
      build_command: cargo build --release --target wasm32-wasip1 --no-default-features --features "wasm all-languages" --lib
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
